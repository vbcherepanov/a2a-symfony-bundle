name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: Bundle checks
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build PHP runtime
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          push: false
          tags: a2a-symfony-bundle-dev:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Match workspace permissions
        run: |
          echo "BUNDLE_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "BUNDLE_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Install locked dependencies
        run: make install
      - name: Tests, static analysis, style and container compilation
        run: make verify
      - name: PostgreSQL persistence and concurrency
        run: make test-postgres
      - name: Symfony version compatibility
        run: make test-symfony
      - name: Check dependencies for known vulnerabilities
        run: docker compose run --rm php composer audit
      - name: Install package into a clean application without native gRPC
        run: make package
      - name: Save verified Composer package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: composer-package
          path: |
            dist/a2a-symfony-bundle.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
